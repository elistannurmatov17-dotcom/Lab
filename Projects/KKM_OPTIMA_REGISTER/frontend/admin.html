<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>KKM — Кабинет менеджера</title>
<style>:root{--ink:#16324a;--soft:#5b6d7b;--bg:#f5f7f7;--card:#fff;--line:#d7e0e2;--accent:#0b7a68;--bad:#b3261e;--soft2:#e3f2ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial}.wrap{max-width:1180px;margin:auto;padding:22px 16px 60px}input,select,textarea{padding:10px;border:1px solid var(--line);border-radius:9px;font:inherit;width:100%;background:#fff}.btn{border:0;border-radius:9px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer;background:var(--accent);color:#fff}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:16px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px}.num{font-size:1.5rem;font-weight:800}.filters{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin:12px 0}.tableWrap{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #e8eeee;text-align:left;white-space:nowrap}.row{cursor:pointer}.row:hover{background:#f8fbfb}.panel{display:none;margin-top:15px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.muted{color:var(--soft)}.tag{display:inline-block;background:var(--soft2);padding:4px 8px;border-radius:999px;font-size:.82rem}.doc{display:inline-block;margin:5px 6px 0 0}.audit{margin-top:15px;border-top:1px solid var(--line);padding-top:12px}.audit div{padding:7px 0;border-bottom:1px solid #edf1f1;font-size:.9rem}.cred{font-family:ui-monospace,SFMono-Regular,monospace;background:#f5f7f7;border-radius:8px;padding:8px;overflow-wrap:anywhere}.error{color:var(--bad)}@media(max-width:900px){.cards{grid-template-columns:repeat(3,1fr)}.filters,.grid{grid-template-columns:1fr}}@media(max-width:560px){.cards{grid-template-columns:1fr 1fr}}</style>
</head><body><div class="wrap">
<div id="login"><h1>Кабинет менеджера ККМ</h1><p class="muted">Доступ только для сотрудников.</p><form id="loginForm"><input name="username" placeholder="Логин" autocomplete="username" required><br><br><input name="password" type="password" placeholder="Пароль" autocomplete="current-password" required><br><br><button class="btn">Войти</button></form><p id="loginMsg" class="error"></p></div>
<div id="app" style="display:none"><div class="top"><div><h1 style="margin:0">Заявки ККМ</h1><span id="me" class="muted"></span></div><button id="logout" class="btn secondary">Выйти</button></div>
<div class="cards" id="cards"></div><div class="filters"><select id="filterStatus"><option value="">Все статусы</option><option>NEW</option><option>IN_PROGRESS</option><option>WAITING_CLIENT</option><option>PROCESSING</option><option>COMPLETED</option><option>REJECTED</option></select><select id="filterManager"><option value="">Все менеджеры</option></select><button class="btn" id="refresh">Обновить</button></div>
<div class="tableWrap"><table><thead><tr><th>№</th><th>Компания</th><th>ИНН</th><th>Точка</th><th>Статус</th><th>Менеджер</th><th>Дата</th></tr></thead><tbody id="rows"></tbody></table></div><div class="panel" id="panel"></div>
</div></div>
<script>
let token=sessionStorage.getItem('kkm_token');let managers=[];const $=s=>document.querySelector(s);
function logout(){sessionStorage.removeItem('kkm_token');location.reload()}$('#logout').onclick=logout;
async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token};const r=await fetch(url,opt);if(r.status===401){logout();throw Error('Сессия истекла')}const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Ошибка API');return d}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadManagers(){managers=await api('/api/managers');$('#filterManager').innerHTML='<option value="">Все менеджеры</option>'+managers.map(m=>'<option value="'+esc(m.id)+'">'+esc(m.username)+'</option>').join('')}
async function load(){const st=$('#filterStatus').value,mid=$('#filterManager').value;const q=new URLSearchParams();if(st)q.set('status_filter',st);if(mid)q.set('manager_id',mid);const a=await api('/api/applications?'+q.toString());const counts={NEW:0,IN_PROGRESS:0,WAITING_CLIENT:0,PROCESSING:0,COMPLETED:0,REJECTED:0};a.forEach(x=>counts[x.status]=(counts[x.status]||0)+1);$('#cards').innerHTML=['NEW','IN_PROGRESS','WAITING_CLIENT','PROCESSING','COMPLETED','REJECTED'].map(s=>'<div class="card"><div>'+s+'</div><div class="num">'+(counts[s]||0)+'</div></div>').join('');const managerName=id=>{const m=managers.find(x=>x.id===id);return m?m.username:'—'};$('#rows').innerHTML=a.map(x=>'<tr class="row" onclick="openApp(\''+x.id+'\')"><td>'+esc(x.application_number)+'</td><td>'+esc(x.company)+'</td><td>'+esc(x.inn)+'</td><td>'+esc(x.point_name)+'</td><td><span class="tag">'+esc(x.status)+'</span></td><td>'+esc(managerName(x.manager_id))+'</td><td>'+new Date(x.created_at).toLocaleString('ru-RU')+'</td></tr>').join('')||'<tr><td colspan="7">Нет заявок</td></tr>'}
async function openApp(id){const [x,audit]=await Promise.all([api('/api/applications/'+id),api('/api/applications/'+id+'/audit')]);const mgrOptions='<option value="">Не назначен</option>'+managers.map(m=>'<option value="'+esc(m.id)+'">'+esc(m.username)+'</option>').join('');$('#panel').style.display='block';$('#panel').innerHTML='<div class="top"><h2>'+esc(x.application_number)+' — '+esc(x.company)+'</h2><button class="btn secondary" onclick="document.querySelector(\'#panel\').style.display=\'none\'">Закрыть</button></div><div class="grid"><div><b>ИНН:</b> '+esc(x.inn)+'<br><b>Юр. адрес:</b> '+esc(x.legal_address)+'<br><b>Директор:</b> '+esc(x.director)+'<br><b>Телефон:</b> '+esc(x.director_phone)+'<br><b>Email:</b> '+esc(x.director_email)+'</div><div><b>Объект:</b> '+esc(x.object_type)+'<br><b>Деятельность:</b> '+esc(x.activity)+'<br><b>УГНС:</b> '+esc(x.ugns)+'<br><b>Точка:</b> '+esc(x.point_name)+'<br><b>Адрес:</b> '+esc(x.point_address)+'<br><b>Налоговый режим:</b> '+esc(x.tax_regime)+'<br><b>НДС:</b> '+(x.vat?'Да':'Нет')+'<br><b>Расчёты:</b> '+esc(x.calc_types.join(', '))+'</div></div><p><b>Комментарий клиента:</b><br>'+esc(x.comment||'—')+'</p><div><b>Менеджер:</b><div style="display:flex;gap:8px;margin-top:6px"><select id="assignee">'+mgrOptions+'</select><button class="btn" onclick="assignApp(\''+id+'\')">Назначить</button></div></div><div style="margin-top:12px"><b>Статус:</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px"><select id="st"><option>NEW</option><option>IN_PROGRESS</option><option>WAITING_CLIENT</option><option>PROCESSING</option><option>COMPLETED</option><option>REJECTED</option></select><input id="internal" placeholder="Внутренний комментарий"></div><button class="btn" style="margin-top:8px" onclick="setStatus(\''+id+'\')">Сохранить статус</button></div><p><b>Документы:</b><br>'+x.documents.map(d=>'<button class="btn secondary doc" onclick="downloadDoc(\''+id+'\',\''+d.id+'\')">'+esc(d.document_type)+' ('+Math.round(d.size_bytes/1024)+' КБ)</button>').join(' ')+'</p><div><button class="btn secondary" onclick="getCreds(\''+id+'\')">Показать доступ lk.salyk.kg</button><div id="cred" style="margin-top:8px"></div></div><div class="audit"><h3>Аудит</h3>'+audit.map(e=>'<div><b>'+esc(e.action)+'</b> — '+new Date(e.created_at).toLocaleString('ru-RU')+'<br><span class="muted">Менеджер: '+esc(e.actor_manager_id||'система')+'</span></div>').join('')+'</div>';$('#assignee').value=x.manager_id||'';$('#st').value=x.status;$('#internal').value=x.internal_comment||''}
window.openApp=openApp;window.assignApp=async id=>{if(!$('#assignee').value)return;await api('/api/applications/'+id+'/assign',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({manager_id:$('#assignee').value})});await load();await openApp(id)};
window.setStatus=async id=>{await api('/api/applications/'+id+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:$('#st').value,internal_comment:$('#internal').value})});await load();await openApp(id)};
window.getCreds=async id=>{const x=await api('/api/applications/'+id+'/credentials');$('#cred').innerHTML='<div class="cred">Логин: '+esc(x.login)+'<br>Пароль: '+esc(x.password)+'</div>'};
window.downloadDoc=async(id,did)=>{const r=await fetch('/api/applications/'+id+'/documents/'+did,{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error('Не удалось скачать документ');const b=await r.blob();const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='document';a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)};
$('#refresh').onclick=load;$('#filterStatus').onchange=load;$('#filterManager').onchange=load;
$('#loginForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);try{const r=await fetch('/api/auth/login',{method:'POST',body:fd});const d=await r.json();if(!r.ok)throw Error(d.detail||'Неверный логин или пароль');token=d.access_token;sessionStorage.setItem('kkm_token',token);await init()}catch(err){$('#loginMsg').textContent=err.message}};
async function init(){if(!token)return;try{const me=await api('/api/auth/me');$('#login').style.display='none';$('#app').style.display='block';$('#me').textContent='Вошли как '+me.username;await loadManagers();await load()}catch(e){sessionStorage.removeItem('kkm_token');token=null}}
init();
</script></body></html>
