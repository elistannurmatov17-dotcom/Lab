<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KKM Admin</title><style>body{font-family:system-ui;background:#f6f8f7;color:#16324a;margin:0}.wrap{max-width:1100px;margin:auto;padding:24px 16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:18px 0}.card{background:#fff;border:1px solid #d5dfe0;border-radius:12px;padding:15px}.num{font-size:1.6rem;font-weight:800}.table{background:#fff;border:1px solid #d5dfe0;border-radius:12px;overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #e7eeee;text-align:left}.click{cursor:pointer}.panel{margin-top:16px;background:#fff;border:1px solid #d5dfe0;border-radius:12px;padding:18px;display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.doc{display:inline-block;margin:5px 5px 5px 0;padding:8px;border:1px solid #d5dfe0;border-radius:8px}.btn{padding:10px 14px;border:0;border-radius:8px;background:#0f7c6c;color:white;font-weight:700;cursor:pointer}@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div id="login"><h1>KKM Manager</h1><form id="loginForm"><input name="username" placeholder="Логин" required><br><br><input name="password" type="password" placeholder="Пароль" required><br><br><button class="btn">Войти</button></form><p id="loginMsg"></p></div><div id="app" style="display:none"><div class="top"><h1>Заявки ККМ</h1><button class="btn" id="logout">Выйти</button></div><div class="cards" id="cards"></div><div class="table"><table><thead><tr><th>№</th><th>Компания</th><th>ИНН</th><th>Точка</th><th>Статус</th><th>Дата</th></tr></thead><tbody id="rows"></tbody></table></div><div class="panel" id="panel"></div></div></div><script>let token=sessionStorage.getItem('kkm_token');const $=s=>document.querySelector(s);async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token};const r=await fetch(url,opt);if(r.status===401)return logout();const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Ошибка API');return d}function logout(){sessionStorage.removeItem('kkm_token');token=null;location.reload()}$('#logout').onclick=logout;$('#loginForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);try{const r=await fetch('/api/auth/login',{method:'POST',body:fd});const d=await r.json();if(!r.ok)throw Error(d.detail||'Неверные данные');token=d.access_token;sessionStorage.setItem('kkm_token',token);showApp()}catch(x){$('#loginMsg').textContent=x.message}};async function showApp(){if(!token)return;try{await api('/api/auth/me');$('#login').style.display='none';$('#app').style.display='block';load()}catch(e){}}async function load(){const a=await api('/api/applications');const counts={NEW:0,IN_PROGRESS:0,WAITING_CLIENT:0,PROCESSING:0,COMPLETED:0,REJECTED:0};a.forEach(x=>counts[x.status]=(counts[x.status]||0)+1);$('#cards').innerHTML=['NEW','IN_PROGRESS','WAITING_CLIENT','PROCESSING','COMPLETED'].map(s=>'<div class="card"><div>'+s+'</div><div class="num">'+(counts[s]||0)+'</div></div>').join('');$('#rows').innerHTML=a.map(x=>'<tr class="click" onclick="openApp(\''+x.id+'\')"><td>'+x.application_number+'</td><td>'+esc(x.company)+'</td><td>'+x.inn+'</td><td>'+esc(x.point_name)+'</td><td>'+x.status+'</td><td>'+new Date(x.created_at).toLocaleString('ru-RU')+'</td></tr>').join('')}function esc(x){return String(x).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}window.openApp=async id=>{const x=await api('/api/applications/'+id);$('#panel').style.display='block';$('#panel').innerHTML='<h2>'+x.application_number+' — '+esc(x.company)+'</h2><div class="grid"><div><b>ИНН:</b> '+x.inn+'<br><b>Директор:</b> '+esc(x.director)+'<br><b>Телефон:</b> '+x.director_phone+'<br><b>УГНС:</b> '+esc(x.ugns)+'</div><div><b>Точка:</b> '+esc(x.point_name)+'<br><b>Адрес:</b> '+esc(x.point_address)+'<br><b>Налоговый режим:</b> '+esc(x.tax_regime)+'<br><b>НДС:</b> '+(x.vat?'Да':'Нет')+'</div></div><p><b>Документы:</b><br>'+x.documents.map(d=>'<button class="doc" onclick="downloadDoc(\''+x.id+'\',\''+d.id+'\')">'+esc(d.document_type)+'</button>').join(' ')+'</p><p><b>Изменить статус:</b> <select id="st"><option>NEW</option><option>IN_PROGRESS</option><option>WAITING_CLIENT</option><option>PROCESSING</option><option>COMPLETED</option><option>REJECTED</option></select> <button class="btn" onclick="setStatus(\''+x.id+'\')">Сохранить</button></p><p><button class="btn" onclick="getCreds(\''+x.id+'\')">Показать доступ lk.salyk.kg</button> <span id="cred"></span></p>';$('#st').value=x.status};window.setStatus=async id=>{await api('/api/applications/'+id+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:$('#st').value})});load();openApp(id)};window.getCreds=async id=>{const x=await api('/api/applications/'+id+'/credentials');$('#cred').textContent=' '+x.login+' / '+x.password};window.downloadDoc=async(id,did)=>{const r=await fetch('/api/applications/'+id+'/documents/'+did,{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error('Не удалось скачать документ');const b=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='document';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};showApp();</script></body></html>
