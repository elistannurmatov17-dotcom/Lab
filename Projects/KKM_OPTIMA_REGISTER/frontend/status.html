<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Статус заявки</title><style>body{font-family:system-ui;background:#f5f7f7;color:#16324a;margin:0}.box{max-width:650px;margin:12vh auto;padding:28px;background:#fff;border:1px solid #d5dfe0;border-radius:14px}.status{padding:14px;border-radius:10px;background:#e3f2ef;font-weight:700}.muted{color:#5b6d7b}</style></head><body><div class="box"><h1>Статус заявки ККМ</h1><div id="out" class="muted">Загрузка…</div></div><script>const out=document.getElementById('out');const token=new URLSearchParams(location.search).get('token');async function run(){if(!token){out.textContent='Не указана ссылка заявки.';return}try{const r=await fetch('/api/public/'+encodeURIComponent(token),{cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Заявка не найдена');out.textContent='';const box=document.createElement('div');box.className='status';box.textContent=d.application_number+' — '+d.status;const company=document.createElement('p');company.textContent=d.company;const date=document.createElement('small');date.textContent='Создана: '+new Date(d.created_at).toLocaleString('ru-RU');out.append(box,company,date)}catch(e){out.textContent=e.message||'Не удалось получить статус'}}run();</script></body></html>
