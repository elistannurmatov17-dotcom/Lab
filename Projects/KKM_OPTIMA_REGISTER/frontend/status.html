<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Статус заявки</title><style>body{font-family:system-ui;background:#f6f8f7;color:#16324a;margin:0}.box{max-width:650px;margin:12vh auto;padding:28px;background:white;border:1px solid #d5dfe0;border-radius:14px}h1{margin-top:0}.status{padding:14px;border-radius:10px;background:#e3f2ef;font-weight:700}</style></head><body><div class="box"><h1>Статус заявки ККМ</h1><div id="out">Загрузка...</div></div><script>const out=document.getElementById('out');const token=new URLSearchParams(location.search).get('token');if(!token){out.textContent='Не указан токен заявки.'}else{fetch('/api/public/'+encodeURIComponent(token)).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.detail||'Заявка не найдена');out.innerHTML='<div class="status">'+d.application_number+' — '+d.status+'</div><p>'+d.company+'</p><small>Создана: '+new Date(d.created_at).toLocaleString('ru-RU')+'</small>'}).catch(e=>out.textContent=e.message)}</script></body></html>
