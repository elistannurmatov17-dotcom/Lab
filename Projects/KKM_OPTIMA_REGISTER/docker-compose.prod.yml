name: kkm_optima_register
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kkm
      POSTGRES_USER: kkm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kkm -d kkm"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 1.0
    networks: [internal]

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://kkm:${POSTGRES_PASSWORD}@postgres:5432/kkm
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?set CREDENTIAL_ENCRYPTION_KEY}
      ENVIRONMENT: production
      MANAGER_1_USERNAME: ${MANAGER_1_USERNAME:?set MANAGER_1_USERNAME}
      MANAGER_1_PASSWORD: ${MANAGER_1_PASSWORD:?set MANAGER_1_PASSWORD}
      MANAGER_2_USERNAME: ${MANAGER_2_USERNAME:?set MANAGER_2_USERNAME}
      MANAGER_2_PASSWORD: ${MANAGER_2_PASSWORD:?set MANAGER_2_PASSWORD}
      MANAGER_3_USERNAME: ${MANAGER_3_USERNAME:?set MANAGER_3_USERNAME}
      MANAGER_3_PASSWORD: ${MANAGER_3_PASSWORD:?set MANAGER_3_PASSWORD}
      UPLOAD_DIR: /data/uploads
    volumes: [private_uploads:/data/uploads]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1.0
    networks: [internal]

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?set ADMIN_DOMAIN}
    volumes:
      - ./frontend:/srv/frontend:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 192m
    cpus: 0.5
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    networks: [internal]

volumes:
  postgres_data:
  private_uploads:
  caddy_data:
  caddy_config:

networks:
  internal:
